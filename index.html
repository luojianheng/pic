<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手绘工坊 · 照片一键四种手绘风格</title>
<style>
:root {
  --bg: #ffffff;
  --ink: #1a1a1a;
  --accent: #d4a574;
  --card: #fafafa;
  --border: #e8e8e8;
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100vh;
}
header {
  text-align: center;
  padding: 32px 20px 18px;
  background: #fff;
  border-bottom: 1px solid var(--border);
}
header .logo {
  font-size: 12px;
  letter-spacing: 3px;
  color: #999;
  margin-bottom: 6px;
}
header h1 {
  font-size: clamp(22px, 4vw, 32px);
  font-weight: 600;
  letter-spacing: 1px;
}
header h1 span { color: var(--accent); }
header p { margin-top: 8px; color: #888; font-size: 13px; }

main { max-width: 820px; margin: 0 auto; padding: 24px 20px 50px; }

.upload-zone {
  background: var(--card);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 56px 24px;
  text-align: center;
  cursor: pointer;
  transition: all .25s;
}
.upload-zone:hover, .upload-zone.dragover {
  border-color: var(--accent);
  background: #fff;
}
.upload-zone .icon { font-size: 38px; }
.upload-zone h3 { margin: 10px 0 6px; font-size: 16px; font-weight: 500; }
.upload-zone p { color: #aaa; font-size: 12px; }
.upload-zone .btn {
  display: inline-block;
  margin-top: 16px;
  padding: 8px 22px;
  background: var(--ink);
  color: #fff;
  border-radius: 20px;
  font-size: 13px;
}

.editor { display: none; margin-top: 20px; }

/* 风格选择器 */
.style-picker {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  flex-wrap: wrap;
  background: #fff;
  border-radius: var(--radius);
  padding: 10px 12px;
  border: 1px solid var(--border);
}
.style-btn {
  flex: 1;
  min-width: 130px;
  padding: 10px 8px;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  text-align: center;
  transition: all .2s;
}
.style-btn .s-icon { font-size: 20px; display: block; margin-bottom: 4px; }
.style-btn .s-name { font-size: 13px; font-weight: 600; color: var(--ink); }
.style-btn .s-desc { font-size: 10px; color: #aaa; margin-top: 2px; }
.style-btn:hover { border-color: var(--accent); }
.style-btn.active {
  border-color: var(--ink);
  background: var(--ink);
}
.style-btn.active .s-name { color: #fff; }
.style-btn.active .s-desc { color: #ccc; }

.stage {
  background: #fff;
  border-radius: var(--radius);
  padding: 18px;
  border: 1px solid var(--border);
}
.compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}
.compare .item .label {
  font-size: 11px;
  color: #999;
  margin-bottom: 6px;
  letter-spacing: 1px;
  text-align: center;
}
.compare canvas {
  width: 100%;
  height: auto;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--border);
}
.compare canvas.out {
  background: #fff;
  border-color: #ccc;
}

.controls {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-top: 16px;
  background: #fff;
  border-radius: var(--radius);
  padding: 14px 18px;
  border: 1px solid var(--border);
  flex-wrap: wrap;
}
.controls label { font-size: 13px; color: #666; white-space: nowrap; }
.controls input[type=range] { flex: 1; min-width: 120px; accent-color: var(--ink); }
.download-btn {
  padding: 9px 22px;
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
}
.download-btn:hover { background: #000; }
.reset-btn {
  padding: 9px 14px;
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
}

.qr-section { max-width: 820px; margin: 28px auto 0; padding: 0 20px; }
.qr-card {
  display: flex;
  align-items: center;
  gap: 22px;
  background: #fff;
  border-radius: var(--radius);
  padding: 20px 24px;
  border: 1px solid var(--accent);
}
.qr-img { width: 120px; height: 120px; border-radius: 8px; flex-shrink: 0; }
.qr-text h3 { font-size: 17px; margin-bottom: 6px; font-weight: 500; }
.qr-text p { color: #888; font-size: 13px; line-height: 1.6; }
.qr-text .qr-tip { margin-top: 6px; color: var(--accent); font-weight: 600; font-size: 12px; }

footer { text-align: center; padding: 20px; color: #bbb; font-size: 11px; }
@media (max-width: 560px) {
  .compare { grid-template-columns: 1fr; }
  .qr-card { flex-direction: column; text-align: center; }
  .style-btn { min-width: 45%; }
}
</style>
</head>
<body>

<header>
  <div class="logo">玩转AI棒棒哒 · HANDDRAWN LAB</div>
  <h1>照片变<span>四种手绘风格</span></h1>
  <p>上传照片 → 一键生成 线条速写 / 铅笔素描 / 水彩画 / 油画笔触</p>
</header>

<main>
  <div class="upload-zone" id="uploadZone">
    <div class="icon">🎨</div>
    <h3>拖拽照片到这里，或点击选择</h3>
    <p>支持 JPG / PNG / WebP · ≤20MB · 纯本地处理，图片不上传服务器</p>
    <span class="btn">选择照片</span>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>

  <div class="editor" id="editor">
    <div class="style-picker" id="stylePicker">
      <button class="style-btn active" data-style="sketch">
        <span class="s-icon">✏️</span>
        <span class="s-name">极简线条速写</span>
        <span class="s-desc">白底黑线 · 轮廓勾勒</span>
      </button>
      <button class="style-btn" data-style="pencil">
        <span class="s-icon">✒️</span>
        <span class="s-name">铅笔素描</span>
        <span class="s-desc">明暗层次 · 碳笔质感</span>
      </button>
      <button class="style-btn" data-style="watercolor">
        <span class="s-icon">💧</span>
        <span class="s-name">水彩画</span>
        <span class="s-desc">晕染通透 · 水色交融</span>
      </button>
      <button class="style-btn" data-style="oil">
        <span class="s-icon">🖌️</span>
        <span class="s-name">油画笔触</span>
        <span class="s-desc">厚涂肌理 · 色彩浓郁</span>
      </button>
    </div>

    <div class="stage">
      <div class="compare">
        <div class="item">
          <div class="label">原图</div>
          <canvas id="origCanvas"></canvas>
        </div>
        <div class="item">
          <div class="label" id="outLabel">极简线条速写</div>
          <canvas id="outCanvas"></canvas>
        </div>
      </div>
    </div>

    <div class="controls">
      <label id="paramLabel">细节强度 <span id="paramVal">50</span></label>
      <input type="range" id="param" min="10" max="100" value="50">
      <button class="download-btn" id="downloadBtn">⬇ 下载 PNG</button>
      <button class="reset-btn" id="resetBtn">换一张</button>
    </div>
  </div>
</main>

<script>
(function() {
  'use strict';

  const uploadZone = document.getElementById('uploadZone');
  const fileInput = document.getElementById('fileInput');
  const editor = document.getElementById('editor');
  const origCanvas = document.getElementById('origCanvas');
  const outCanvas = document.getElementById('outCanvas');
  const outLabel = document.getElementById('outLabel');
  const param = document.getElementById('param');
  const paramVal = document.getElementById('paramVal');
  const paramLabel = document.getElementById('paramLabel');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');
  const styleBtns = Array.from(document.querySelectorAll('.style-btn'));

  let img = null;
  let currentStyle = 'sketch';
  const MAX_W = 1400;

  const STYLE_META = {
    sketch: { name: '极简线条速写', paramLabel: '线条强度', file: '线条速写' },
    pencil: { name: '铅笔素描', paramLabel: '素描浓度', file: '铅笔素描' },
    watercolor: { name: '水彩画', paramLabel: '水彩晕染', file: '水彩画' },
    oil: { name: '油画笔触', paramLabel: '笔触粗度', file: '油画' }
  };

  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFile(fileInput.files[0]); });

  styleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      styleBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      outLabel.textContent = STYLE_META[currentStyle].name;
      paramLabel.innerHTML = STYLE_META[currentStyle].paramLabel + ' <span id="paramVal">' + param.value + '</span>';
      document.getElementById('paramVal').textContent = param.value;
      paramVal.textContent = param.value;
      render();
    });
  });

  function loadFile(file) {
    if (!file.type.match(/^image\/(jpeg|png|webp)/)) { alert('请选择 JPG/PNG/WebP 图片'); return; }
    if (file.size > 20 * 1024 * 1024) { alert('图片超过 20MB'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      const im = new Image();
      im.onload = () => { init(im); };
      im.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function init(im) {
    img = im;
    let w = im.naturalWidth, h = im.naturalHeight;
    if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
    origCanvas.width = w; origCanvas.height = h;
    outCanvas.width = w; outCanvas.height = h;
    origCanvas.getContext('2d').drawImage(im, 0, 0, w, h);
    uploadZone.style.display = 'none';
    editor.style.display = 'block';
    render();
  }

  // ============ 通用像素工具 ============

  // 获取灰度数组
  function getGray(src) {
    const W = origCanvas.width, H = origCanvas.height;
    const gray = new Uint8ClampedArray(W * H);
    for (let i = 0; i < src.data.length; i += 4) {
      gray[i >> 2] = 0.299 * src.data[i] + 0.587 * src.data[i+1] + 0.114 * src.data[i+2];
    }
    return gray;
  }

  // Sobel 边缘检测 -> 边缘强度数组
  function sobelEdges(gray) {
    const W = origCanvas.width, H = origCanvas.height;
    const sobelX = [-1, 0, 1, -2, 0, 2, -1, 0, 1];
    const sobelY = [-1, -2, -1, 0, 0, 0, 1, 2, 1];
    const mag = new Uint8ClampedArray(W * H);
    for (let y = 1; y < H - 1; y++) {
      for (let x = 1; x < W - 1; x++) {
        let gx = 0, gy = 0, idx = 0;
        for (let ky = -1; ky <= 1; ky++) {
          for (let kx = -1; kx <= 1; kx++) {
            const v = gray[(y + ky) * W + (x + kx)];
            gx += v * sobelX[idx];
            gy += v * sobelY[idx];
            idx++;
          }
        }
        let m = Math.sqrt(gx * gx + gy * gy);
        mag[y * W + x] = m > 255 ? 255 : m;
      }
    }
    return mag;
  }

  // 盒式模糊（多次迭代近似高斯）
  function boxBlur(gray, radius) {
    const W = origCanvas.width, H = origCanvas.height;
    const src = new Uint8ClampedArray(gray);
    const dst = new Uint8ClampedArray(W * H);
    const r = Math.max(1, radius);
    for (let pass = 0; pass < 2; pass++) {
      // 水平
      for (let y = 0; y < H; y++) {
        let sum = 0;
        for (let x = -r; x <= r; x++) {
          const xx = x < 0 ? 0 : (x >= W ? W - 1 : x);
          sum += src[y * W + xx];
        }
        for (let x = 0; x < W; x++) {
          dst[y * W + x] = sum / (r * 2 + 1);
          const outX = x + r + 1;
          const inX = x - r;
          sum += src[y * W + (outX >= W ? W - 1 : outX)];
          sum -= src[y * W + (inX < 0 ? 0 : inX)];
        }
      }
      // 垂直
      for (let x = 0; x < W; x++) {
        let sum = 0;
        for (let y = -r; y <= r; y++) {
          const yy = y < 0 ? 0 : (y >= H ? H - 1 : y);
          sum += dst[yy * W + x];
        }
        for (let y = 0; y < H; y++) {
          src[y * W + x] = sum / (r * 2 + 1);
          const outY = y + r + 1;
          const inY = y - r;
          sum += dst[(outY >= H ? H - 1 : outY) * W + x];
          sum -= dst[(inY < 0 ? 0 : inY) * W + x];
        }
      }
      for (let i = 0; i < W * H; i++) src[i] = Math.round(src[i]);
      if (pass === 0) { for (let i = 0; i < W * H; i++) dst[i] = src[i]; }
    }
    return src;
  }

  // 输出灰度数组到 canvas（灰度图）
  function putGray(gray) {
    const W = origCanvas.width, H = origCanvas.height;
    const ctx = outCanvas.getContext('2d');
    const out = ctx.createImageData(W, H);
    const d = out.data;
    for (let i = 0; i < gray.length; i++) {
      const v = gray[i];
      const idx = i << 2;
      d[idx] = v; d[idx+1] = v; d[idx+2] = v; d[idx+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  // 灰度 -> RGB 输出（彩色用）
  function putRGB(rgb) {
    const ctx = outCanvas.getContext('2d');
    ctx.putImageData(rgb, 0, 0);
  }

  // 读取原图 RGB ImageData
  function getRGB() {
    return origCanvas.getContext('2d').getImageData(0, 0, origCanvas.width, origCanvas.height);
  }

  // ============ 四种风格算法 ============

  // 1. 极简线条速写（白底黑线）
  function renderSketch(strength) {
    const src = origCanvas.getContext('2d').getImageData(0, 0, origCanvas.width, origCanvas.height);
    const gray = getGray(src);
    const mag = sobelEdges(gray);
    const W = origCanvas.width, H = origCanvas.height;
    const threshold = Math.round(255 * (1 - strength * 0.55) - 60);
    const t = Math.max(80, Math.min(180, threshold));
    const ctx = outCanvas.getContext('2d');
    const out = ctx.createImageData(W, H);
    const d = out.data;
    for (let i = 0; i < mag.length; i++) {
      const v = mag[i] > t ? 0 : 255;
      const idx = i << 2;
      d[idx] = v; d[idx+1] = v; d[idx+2] = v; d[idx+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  // 2. 铅笔素描（明暗层次：反相 + 模糊叠加）
  function renderPencil(strength) {
    const src = origCanvas.getContext('2d').getImageData(0, 0, origCanvas.width, origCanvas.height);
    const W = origCanvas.width, H = origCanvas.height;
    const gray = getGray(src);
    // 模糊半径随强度变化（10~100 -> 3~10）
    const radius = Math.round(3 + strength * 7);
    const blurred = boxBlur(gray, radius);
    const ctx = outCanvas.getContext('2d');
    const out = ctx.createImageData(W, H);
    const d = out.data;
    // 铅笔明暗：result = (gray * (255 - blurred) / (255 - blurred + something)) 简化 dodge:
    // 经典算法: out = gray * 255 / (255 - (255 - blurred)) = gray*255/blurred —— 用模糊图作分母
    for (let i = 0; i < gray.length; i++) {
      const b = blurred[i];
      const g = gray[i];
      // dodge: g / (255 - (255-b)) * 255 即 g*255/b；再加对比与强度控制
      let v;
      if (b === 0) v = 255;
      else v = Math.min(255, (g * 255) / b);
      // 强度越高越浓（加深）
      const depth = 0.55 + strength * 0.45;
      v = Math.round(255 - (255 - v) * depth);
      const idx = i << 2;
      d[idx] = v; d[idx+1] = v; d[idx+2] = v; d[idx+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  // 3. 水彩画（柔化 + 色块量化 + 通透晕染）
  function renderWatercolor(strength) {
    const src = origCanvas.getContext('2d').getImageData(0, 0, origCanvas.width, origCanvas.height);
    const W = origCanvas.width, H = origCanvas.height;
    const s = src.data;
    // 1) 高斯模糊（柔化晕染）
    const gray = getGray(src);
    const radius = Math.round(2 + strength * 5);
    const blurred = boxBlur(gray, radius);
    // 2) 色阶量化 + 水彩提亮通透
    const ctx = outCanvas.getContext('2d');
    const out = ctx.createImageData(W, H);
    const d = out.data;
    const levels = Math.round(6 + strength * 6); // 6~12 级
    for (let i = 0; i < s.length; i += 4) {
      // 用模糊灰度混合原色，形成水彩底色
      const b = blurred[i >> 2];
      const mix = 0.55 + strength * 0.2;
      let r = s[i] * (1 - mix) + b * mix;
      let g = s[i+1] * (1 - mix) + b * mix;
      let bl = s[i+2] * (1 - mix) + b * mix;
      // 量化色阶
      r = Math.round(r / levels) * levels;
      g = Math.round(g / levels) * levels;
      bl = Math.round(bl / levels) * levels;
      // 提亮 + 微降饱和（水彩通透）
      r = Math.min(255, r + 12);
      g = Math.min(255, g + 12);
      bl = Math.min(255, bl + 12);
      d[i] = r; d[i+1] = g; d[i+2] = bl; d[i+3] = 255;
    }
    ctx.putImageData(out, 0, 0);
  }

  // 4. 油画笔触（色块聚类 + 纹理）
  function renderOil(strength) {
    const src = origCanvas.getContext('2d').getImageData(0, 0, origCanvas.width, origCanvas.height);
    const W = origCanvas.width, H = origCanvas.height;
    const s = src.data;
    // 笔触大小：强度越高笔触越粗（2~10）
    const brush = Math.round(2 + strength * 8);
    const ctx = outCanvas.getContext('2d');
    const out = ctx.createImageData(W, H);
    const d = out.data;
    // 简单油画：局部均值色块（块状聚类） + 增强对比 + 边缘深描
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        // 取块内均值（笔触色块）
        let rs = 0, gs = 0, bs = 0, cnt = 0;
        const bx0 = Math.max(0, x - brush), bx1 = Math.min(W - 1, x + brush);
        const by0 = Math.max(0, y - brush), by1 = Math.min(H - 1, y + brush);
        for (let yy = by0; yy <= by1; yy += Math.max(1, brush >> 1)) {
          for (let xx = bx0; xx <= bx1; xx += Math.max(1, brush >> 1)) {
            const idx = (yy * W + xx) << 2;
            rs += s[idx]; gs += s[idx+1]; bs += s[idx+2]; cnt++;
          }
        }
        let r = rs / cnt, g = gs / cnt, b = bs / cnt;
        // 增强色彩对比
        r = (r - 128) * 1.12 + 128;
        g = (g - 128) * 1.12 + 128;
        b = (b - 128) * 1.12 + 128;
        const idx = (y * W + x) << 2;
        d[idx] = Math.max(0, Math.min(255, r));
        d[idx+1] = Math.max(0, Math.min(255, g));
        d[idx+2] = Math.max(0, Math.min(255, b));
        d[idx+3] = 255;
      }
    }
    // 边缘深描（叠加 Sobel 边缘加深）
    const gray = getGray(src);
    const mag = sobelEdges(gray);
    const edgeT = 140 - strength * 40;
    for (let i = 0; i < mag.length; i++) {
      if (mag[i] > edgeT) {
        const idx = i << 2;
        d[idx] = Math.max(0, d[idx] - 60);
        d[idx+1] = Math.max(0, d[idx+1] - 60);
        d[idx+2] = Math.max(0, d[idx+2] - 60);
      }
    }
    ctx.putImageData(out, 0, 0);
  }

  // ============ 渲染入口 ============
  function render() {
    if (!img) return;
    const strength = parseInt(param.value, 10) / 100;
    switch (currentStyle) {
      case 'sketch': renderSketch(strength); break;
      case 'pencil': renderPencil(strength); break;
      case 'watercolor': renderWatercolor(strength); break;
      case 'oil': renderOil(strength); break;
    }
  }

  param.addEventListener('input', () => {
    paramVal.textContent = param.value;
    const el = document.getElementById('paramVal');
    if (el) el.textContent = param.value;
    render();
  });

  downloadBtn.addEventListener('click', () => {
    const meta = STYLE_META[currentStyle];
    const a = document.createElement('a');
    a.download = meta.file + '_' + Date.now() + '.png';
    a.href = outCanvas.toDataURL('image/png');
    a.click();
  });

  resetBtn.addEventListener('click', () => {
    img = null;
    editor.style.display = 'none';
    uploadZone.style.display = '';
    fileInput.value = '';
  });
})();
</script>
</body>
</html>
